<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F8FF">
<meta name="description" content="Game rolling pertanyaan cinta buat tongkrongan di mobil. Gratis, langsung main.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rolling Topik">
<title>Rolling Topik Mobil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800;1,900&family=Caveat:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* Layout: phone = one column, sticky action bar at the bottom. Desktop = hero art on the left, setup cards on the right.
   Look follows "Kit Desain Rolling Topik Mobil": violet + sun yellow on cool paper, sketchy ink outlines, handwritten notes. */
:root {
  --bg: #F6F8FF;
  --surface: #FFFFFF;
  --primary: #6C63FF;
  --primary-hover: #4A3AFF;
  --light: #EADFFF;
  --soft: #F2EEFF;
  --yellow: #F9C94C;
  --error: #FF666B;
  --fg: #1F1F38;
  --muted: #6B7280;
  --line: #E4E1F4;
  --f-head: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand: "Caveat", "Comic Sans MS", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-head); font-size: 15px; line-height: 1.5;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
p { margin: 0; }
svg { display: block; }

/* ---------- ambient background ---------- */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg .blob { position: absolute; border-radius: 50%; filter: blur(2px); opacity: .9; animation: drift 16s ease-in-out infinite alternate; }
.bg .b1 { width: 340px; height: 300px; top: -120px; left: -140px; background: radial-gradient(circle at 60% 60%, #F9C94C 0 45%, #F9C94C00 72%); }
.bg .b2 { width: 360px; height: 360px; top: -140px; right: -160px; background: radial-gradient(circle at 40% 60%, #B9B2FF 0 40%, #B9B2FF00 70%); animation-duration: 20s; }
.bg .b3 { width: 380px; height: 320px; bottom: -170px; right: -120px; background: radial-gradient(circle at 40% 40%, #D9D0FF 0 42%, #D9D0FF00 72%); animation-duration: 24s; }
.bg .b4 { width: 300px; height: 260px; bottom: -140px; left: -120px; background: radial-gradient(circle at 60% 40%, #C9C2FF 0 40%, #C9C2FF00 70%); animation-duration: 18s; }
.bg .spark { position: absolute; width: 16px; color: var(--yellow); animation: twinkle 3.2s ease-in-out infinite; }
.bg .spark.v { color: var(--primary); width: 12px; }
@keyframes drift { to { transform: translate(30px, 24px) scale(1.08) rotate(8deg); } }
@keyframes twinkle { 0%, 100% { transform: scale(.6) rotate(0); opacity: .4; } 50% { transform: scale(1.15) rotate(30deg); opacity: 1; } }

/* ---------- app frame ---------- */
.app {
  position: relative; z-index: 1; height: 100%; margin: 0 auto; max-width: 560px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column;
}
.app.wide { max-width: 1160px; }
.screen { display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 16px; padding: 4px 4px 0; margin: 0 -4px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.hand { font-family: var(--f-hand); font-weight: 700; line-height: 1.05; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.ic { width: 1.15em; height: 1.15em; flex: none; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 16px; padding: 12px 18px; min-height: 54px; cursor: pointer;
  font-weight: 700; font-size: 1rem; transition: transform .15s cubic-bezier(.3,1.6,.5,1), background .15s, border-color .15s, box-shadow .15s;
  touch-action: manipulation; user-select: none; white-space: nowrap;
}
.btn:hover:not([disabled]) { transform: translateY(-2px); border-color: #CFC9F5; }
.btn:active:not([disabled]) { transform: scale(.95); }
.btn:focus-visible, .chip-btn:focus-visible, .who:focus-visible, .preset:focus-visible, .num:focus-visible, .info:focus-visible, .hud-b:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.btn.primary {
  position: relative; isolation: isolate; color: #fff; border: 0;
  background: var(--primary); font-weight: 800; font-size: 1.08rem;
  border-radius: 20px 26px 18px 28px / 26px 18px 28px 20px;
  box-shadow: 0 10px 22px -10px #4A3AFFaa;
}
.btn.primary::before { /* brush bristle texture */
  content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; opacity: .35;
  background: repeating-linear-gradient(176deg, #ffffff00 0 5px, #ffffff40 5px 6px, #ffffff00 6px 11px);
}
.btn.primary:hover:not([disabled]) { background: var(--primary-hover); }
.btn.primary .arrow { animation: nudge 1.2s ease-in-out infinite; }
.btn.primary .dice-ic { transition: transform .4s; }
.btn.primary:hover .dice-ic { transform: rotate(180deg); }
.btn.secondary { border-color: var(--fg); border-width: 2px; }
.btn.soft { background: var(--soft); border-color: #DCD5FF; color: var(--primary); font-weight: 800; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn.primary[disabled] { background: #A9A4FF; opacity: 1; }
.btn.primary[disabled] .arrow { animation: none; }
.btn.spinning .dice-ic { animation: spin .5s linear infinite; }
@keyframes nudge { 50% { transform: translateX(4px); } }
@keyframes spin { to { transform: rotate(360deg); } }
.bar { display: flex; gap: 10px; flex: none; }
.bar > * { flex: 1; min-width: 0; }
.bar .btn { padding-inline: 12px; gap: 8px; }
.bar > .primary { flex: 1.8; }

/* ---------- logo + illustrations ---------- */
.logo { font-size: var(--logo, 3.3rem); position: relative; display: inline-flex; flex-direction: column; font-family: var(--f-head); font-style: italic; font-weight: 900; line-height: .9; letter-spacing: -.035em; transform: rotate(-5deg); transform-origin: left center; }
.logo .l1 { color: var(--fg); font-size: 1em; position: relative; z-index: 1; }
.logo .l2 { color: var(--primary); font-size: 1em; position: relative; z-index: 1; padding-left: .3em; }
.logo .brush { position: absolute; left: 4%; right: -6%; bottom: -12%; height: 62%; z-index: -1; }
.logo .ticks { position: absolute; left: -.55em; top: .1em; width: .5em; z-index: 1; }
.cube-wrap { width: var(--s); height: var(--s); perspective: 700px; }
.roller { width: 100%; height: 100%; transform-style: preserve-3d; }
.roller.idle { animation: idle 14s linear infinite; }
.cube { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateX(-24deg) rotateY(-36deg); }
.cube .f { position: absolute; inset: 0; background: #fff; border: calc(var(--s) * .05) solid var(--fg); border-radius: 22%; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 12%; }
.cube .f i { width: 64%; aspect-ratio: 1; border-radius: 50%; place-self: center; }
.cube .f i.p { background: var(--fg); }
.cube .f0 { transform: translateZ(calc(var(--s) / 2)); }
.cube .f1 { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.cube .f2 { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); background: #F1EEFF; }
.cube .f3 { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); background: #F1EEFF; }
.cube .f4 { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
.cube .f5 { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
@keyframes idle { to { transform: rotateX(360deg) rotateY(720deg); } }
.dice-box { position: relative; display: grid; justify-items: center; }
.dice-box .crown { width: calc(var(--s) * .55); margin-bottom: calc(var(--s) * -.12); transform: rotate(-12deg); position: relative; z-index: 2; }
.dice-box .shadow { width: calc(var(--s) * .9); height: calc(var(--s) * .16); border-radius: 50%; background: #6C63FF33; margin-top: calc(var(--s) * .16); animation: shadow 2.6s ease-in-out infinite; }
.dice-box .float { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-10px); } }
@keyframes shadow { 50% { transform: scaleX(.8); opacity: .6; } }
.bubble { font-family: var(--f-hand); font-weight: 700; font-size: 1.2rem; line-height: 1; text-align: center; background: var(--yellow); color: var(--fg); padding: 12px 14px; border-radius: 52% 48% 46% 54% / 58% 50% 50% 42%; transform: rotate(-7deg); box-shadow: 3px 4px 0 #1F1F3812; }
.car .wheel { transform-box: fill-box; transform-origin: center; animation: spin .7s linear infinite; }
.car .speed { animation: speed .5s ease-in-out infinite alternate; }
@keyframes speed { to { transform: translateX(-5px); opacity: .5; } }
.road .dash { stroke-dasharray: 16 14; animation: road 1s linear infinite; }
@keyframes road { to { stroke-dashoffset: -30; } }
.tilt { transform: perspective(800px) rotateY(calc(var(--mx, 0) * 7deg)) rotateX(calc(var(--my, 0) * -7deg)); transition: transform .25s ease-out; }

/* ---------- loader ---------- */
.loader { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; overflow: hidden; cursor: pointer; }
.loader .stage { position: relative; width: min(92vw, 520px); display: flex; flex-direction: column; align-items: center; gap: 22px; padding-bottom: 190px; }
.loader .logo { --logo: clamp(2.6rem, 12vw, 4rem); }
.loader .dice-box { --s: 84px; }
.loader .road { position: absolute; left: 50%; bottom: 0; width: 760px; height: 180px; transform: translateX(-50%); }
.loader .car { position: absolute; bottom: 58px; left: 50%; width: 150px; margin-left: -75px; }
.loader .meter { width: min(260px, 70vw); height: 12px; border-radius: 999px; background: #fff; border: 2px solid var(--fg); overflow: hidden; }
.loader .meter i { display: block; height: 100%; width: 100%; background: repeating-linear-gradient(-45deg, var(--primary) 0 10px, var(--primary-hover) 10px 20px); transform-origin: left; transform: scaleX(0); }
.loader .msg { font-family: var(--f-hand); font-size: 1.5rem; font-weight: 700; color: var(--primary); min-height: 1.6em; }
.loader .skip { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); font-size: .8rem; color: var(--muted); }

/* ---------- setup ---------- */
.setup-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.setup-grid > * { min-width: 0; }
.brandline { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: .95rem; }
.brandline .badge { width: 30px; height: 30px; border-radius: 10px; background: var(--primary); display: grid; place-items: center; transform: rotate(-8deg); }
.brandline .badge svg { width: 18px; }
.hero { display: flex; flex-direction: column; gap: 14px; position: relative; }
.hero-art { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 22px 0 0 14px; }
.hero-art [data-in=dice] { position: absolute; right: 6px; top: 0; }
.hero-art .logo { --logo: clamp(2.3rem, 11.5vw, 3.6rem); }
.hero-art .dice-box { --s: clamp(54px, 15vw, 96px); margin-bottom: 12px; }
.hero .bubble { align-self: flex-end; margin-right: 6px; font-size: 1rem; padding: 9px 11px; z-index: 3; position: relative; }
.hero .note-top { position: absolute; right: 4px; top: 2px; font-size: 1.15rem; color: var(--fg); transform: rotate(4deg); text-align: right; display: none; }
.tagline { color: var(--muted); max-width: 40ch; font-size: .92rem; }
.hero-road { display: none; position: relative; height: 210px; margin: 0 -40px; }
.hero-road .road { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-road .car { position: absolute; width: 130px; left: 22%; bottom: 82px; animation: cruise 6s ease-in-out infinite alternate; }
@keyframes cruise { to { transform: translate(140px, -30px) rotate(-6deg); } }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 24px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 14px 30px -22px #4A3AFF66; position: relative; }
.panel-h { display: flex; gap: 12px; align-items: flex-start; }
.panel-h .n { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 800; display: grid; place-items: center; flex: none; font-size: 1.05rem; transform: rotate(-6deg); box-shadow: 2px 3px 0 var(--fg); }
.panel-h h2 { margin: 0; font-size: 1.12rem; font-weight: 800; line-height: 1.2; }
.panel-h p { color: var(--muted); font-size: .8rem; }
.names { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--soft); border: 1.5px solid #DCD5FF; border-radius: 999px; padding: 4px 4px 4px 14px; font-weight: 700; font-size: .92rem; }
.chip-btn { border: 0; background: transparent; color: var(--primary); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.chip-btn:hover { background: #fff; }
.chip.add-chip { background: transparent; border-style: dashed; color: var(--muted); padding: 4px 14px; cursor: pointer; gap: 6px; }
.field { display: flex; gap: 8px; }
.input { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 0 14px; transition: border-color .15s, box-shadow .15s; }
.input:focus-within { border-color: var(--yellow); box-shadow: 0 0 0 4px #F9C94C33; }
.input.err { border-color: var(--error); box-shadow: 0 0 0 4px #FF666B22; }
.input .ic { color: var(--muted); }
.input input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; color: var(--fg); background: transparent; padding: 13px 0; }
.field .btn { min-height: 0; padding: 0 16px; border-width: 2px; border-color: var(--fg); }
.hint { font-size: .8rem; color: var(--muted); }
.presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (max-width: 340px) { .presets { grid-template-columns: 1fr; } }
.preset { position: relative; border: 1.5px solid var(--line); background: #fff; border-radius: 16px; padding: 12px 10px 10px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 6px; transition: border-color .15s, background .15s, transform .15s; }
.preset:hover { transform: translateY(-2px); }
.preset .emo { font-size: 1.6rem; line-height: 1; }
.preset b { font-size: .9rem; display: block; }
.preset small { color: var(--muted); font-size: .72rem; line-height: 1.3; display: block; }
.preset .ck { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #CFCBE6; display: grid; place-items: center; color: #fff; }
.preset .ck svg { width: 11px; opacity: 0; }
.preset[aria-pressed="true"] { border-color: var(--primary); background: var(--soft); box-shadow: 0 0 0 3px #6C63FF1f; }
.preset[aria-pressed="true"] b { color: var(--primary); }
.preset[aria-pressed="true"] .ck { background: var(--primary); border-color: var(--primary); }
.preset[aria-pressed="true"] .ck svg { opacity: 1; }
.info { all: unset; cursor: pointer; display: flex; gap: 12px; align-items: center; background: var(--soft); border-radius: 14px; padding: 10px 12px; }
.info .i { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; flex: none; font-weight: 800; font-style: italic; font-family: Georgia, serif; }
.info b { color: var(--primary); font-size: .85rem; display: block; }
.info small { color: var(--muted); font-size: .76rem; display: block; }
.info .chev { margin-left: auto; color: var(--primary); transition: transform .25s; }
.info[aria-expanded="true"] .chev { transform: rotate(180deg); }
.rounds { display: grid; gap: 6px; }
.round { display: flex; align-items: center; gap: 10px; text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 9px 12px; cursor: pointer; min-width: 0; }
.round .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid #CFCBE6; flex: none; display: grid; place-items: center; color: #fff; }
.round .box svg { width: 12px; opacity: 0; }
.round[aria-pressed="true"] { border-color: #C9C2FF; }
.round[aria-pressed="true"] .box { background: var(--primary); border-color: var(--primary); }
.round[aria-pressed="true"] .box svg { opacity: 1; }
.round .t { display: flex; flex-direction: column; min-width: 0; }
.round .t b { font-size: .86rem; }
.round .t small { color: var(--muted); font-size: .74rem; }
.round .no { margin-left: auto; font-size: .7rem; font-weight: 700; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.tag-new { font-size: .58rem; font-weight: 800; letter-spacing: .08em; color: #fff; background: var(--error); border-radius: 6px; padding: 1px 5px; margin-left: 6px; vertical-align: 2px; }
.sticky-bar { position: sticky; bottom: 0; padding: 14px 0 4px; background: linear-gradient(#F6F8FF00, var(--bg) 40%); display: flex; flex-direction: column; gap: 8px; z-index: 4; }
.note-bottom { font-size: 1.15rem; color: var(--fg); text-align: center; transform: rotate(-2deg); }

@media (min-width: 920px) {
  .setup-grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 48px; align-items: center; min-height: 100%; }
  .hero-art { padding: 50px 0 0 40px; }
  .hero-art .logo { --logo: clamp(3rem, 4.4vw, 4rem); }
  .hero-art [data-in=dice] { right: 10px; top: 0; }
  .hero-art .dice-box { --s: 110px; }
  .hero .bubble { font-size: 1.35rem; padding: 16px 18px; margin-top: 10px; }
  .hero .note-top { display: block; right: 120px; top: 0; }
  .hero-road { display: block; }
  .tagline { font-size: 1.05rem; padding-left: 40px; }
  .setup-cards { padding-block: 24px; }
  .panel { padding: 22px; }
}

/* ---------- game HUD ---------- */
.game { width: 100%; max-width: 620px; margin: 0 auto; }
.hud { display: flex; align-items: center; gap: 10px; flex: none; }
.hud-b { width: 42px; height: 42px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; flex: none; color: var(--fg); transition: transform .15s; }
.hud-b:active { transform: scale(.9); }
.hud-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.hud-mid .ttl { display: flex; justify-content: space-between; gap: 8px; font-size: .74rem; font-weight: 700; white-space: nowrap; }
.hud-mid .ttl span:first-child { overflow: hidden; text-overflow: ellipsis; min-width: 0; color: var(--primary); }
.hud-mid .ttl span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.track { position: relative; height: 10px; border-radius: 999px; background: var(--fg); }
.track::after { content: ""; position: absolute; left: 6px; right: 6px; top: 4px; height: 2px; background: repeating-linear-gradient(90deg, var(--yellow) 0 8px, transparent 8px 14px); }
.track .mini { position: absolute; bottom: 3px; width: 36px; margin-left: -18px; }

/* ---------- pick ---------- */
.asker { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.asker .lbl { font-size: .8rem; font-weight: 700; color: var(--muted); }
.asker h2 { font-family: var(--f-head); font-style: italic; font-weight: 900; font-size: clamp(2.1rem, 11vw, 3.2rem); margin: 0; line-height: 1.05; position: relative; letter-spacing: -.03em; overflow-wrap: anywhere; }
.asker h2 span { position: relative; z-index: 1; }
.asker h2::after { content: ""; position: absolute; left: -6px; right: -10px; bottom: 4px; height: 38%; background: var(--yellow); border-radius: 40% 60% 50% 50% / 60% 50% 50% 40%; transform: rotate(-2deg); z-index: 0; }
.asker .sub { color: var(--muted); font-size: .9rem; margin-top: 4px; }
.whos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.who { position: relative; display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); background: #fff; border-radius: 18px; padding: 12px; cursor: pointer; text-align: left; transition: border-color .12s, background .12s, transform .15s cubic-bezier(.3,1.6,.5,1); min-width: 0; }
.who:hover:not([disabled]) { transform: translateY(-2px); }
.who .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; flex: none; border: 2px solid var(--fg); font-size: 1rem; }
.who .t { display: flex; flex-direction: column; min-width: 0; }
.who b { font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who small { font-size: .72rem; color: var(--muted); }
.who.on { border-color: var(--primary); background: var(--soft); box-shadow: 0 0 0 4px #6C63FF22; }
.who.on b { color: var(--primary); }
.who.flash { border-color: var(--yellow); background: #FFF6D6; transform: scale(1.03); }
.who[disabled] { opacity: .45; cursor: not-allowed; }
.who .badge-last { position: absolute; top: -8px; right: 8px; font-size: .62rem; font-weight: 800; background: var(--fg); color: #fff; border-radius: 6px; padding: 1px 6px; }

function start() {

}

}

}
// Draws from the current round; moves on to the next round if this one ran dry.
function draw() {
  while (S.ri < S.order.length && !curPool().length) S.ri++;
  if (S.ri >= S.order.length) { S.phase = "end"; S.q = null; return false; }
  const pool = curPool();

}

}

  if (draw()) {

}

  S.asker = (S.asker + 1) % S.players.length;

}

// ---------- render + entrance motion ----------
let lastPhase = null, lastSheet = "", lastTut = null;
function render(anim = false) {
  const views = { setup: vSetup, pick: vPick, card: vCard, between: vBetween, end: vEnd };
  if (!views[S.phase] || (S.phase === "card" && !S.q)) S.phase = S.players ? "pick" : "setup";
  const app = $("#app");
  const sheet = ui.imp ? "imp" : ui.tut != null ? "tut" : ui.rules ? "rules" : ui.nums ? "nums" : "";
  app.classList.toggle("wide", S.phase === "setup");
  app.innerHTML = views[S.phase]() + (ui.tut != null ? vTut() : "") + (ui.rules ? vRules() : "") + (ui.nums ? vNums() : "") + (ui.imp ? vImport() : "");
  const phaseChanged = S.phase !== lastPhase || anim;
  if (phaseChanged) enter(S.phase);
  if (sheet && sheet !== lastSheet) sheetIn();
  else if (sheet === "tut" && lastTut != null && ui.tut !== lastTut && M()) G.from(".tut .slide", { x: (ui.tut > lastTut ? 1 : -1) * 50, opacity: 0, duration: .4, ease: "power3.out" });
  lastPhase = S.phase; lastSheet = sheet; lastTut = ui.tut;
  if (S.phase === "card") bindSwipe();
  save();
}
function enter(phase) {
  if (!M()) return;
  const items = $$("#app [data-in]");
  G.from(items.filter(e => !e.dataset.in), { y: 26, opacity: 0, duration: .55, stagger: .07, ease: "back.out(1.6)", clearProps: "transform,opacity" });
  const logo = $("#app [data-in=logo] .logo");
  if (logo) {
    G.from(logo.querySelectorAll(".l1, .l2"), { y: 40, opacity: 0, rotation: -8, duration: .6, stagger: .1, ease: "back.out(2)" });
    G.fromTo(logo.querySelector(".brush"), { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: .6, delay: .35, ease: "power2.out" });
  }
  const dice = $("#app [data-in=dice]");
  if (dice) G.from(dice, { y: -160, rotation: 90, opacity: 0, duration: 1, delay: .15, ease: "bounce.out" });
  const pop = $("#app [data-in=pop]");
  if (pop) G.from(pop, { scale: 0, rotation: -40, duration: .6, delay: .6, ease: "back.out(2.4)" });
  const whos = $$("#app [data-in=who]");
  if (whos.length) G.from(whos, { scale: .6, opacity: 0, duration: .45, stagger: .05, delay: .15, ease: "back.out(2)", clearProps: "transform,opacity" });
  const stack = $("#app [data-in=stack]");
  if (stack) {
    G.from("#qcard", { rotationY: -100, opacity: 0, duration: .7, ease: "back.out(1.3)", transformOrigin: "50% 50%", clearProps: "transform,opacity" });
    G.from("#qcard .q .w", { y: 16, opacity: 0, duration: .35, stagger: .025, delay: .3, ease: "power2.out" });
  }
  const slam = $("#app [data-in=slam]");
  if (slam) G.from(slam, { scale: 1.8, rotation: -6, opacity: 0, duration: .6, delay: .1, ease: "back.out(2.2)" });
  const mapcar = $("#mapcar");
  if (mapcar) G.fromTo(mapcar, { left: mapcar.dataset.from + "%" }, { left: mapcar.style.left, duration: 1.2, delay: .4, ease: "power2.inOut" });
  const fills = $$(".bar-fill");
  if (fills.length) G.from(fills, { scaleX: 0, duration: .9, stagger: .12, delay: .4, ease: "power3.out" });
  if (phase === "end") confetti();
  const mini = $(".track .mini");
  if (mini && ui.hudP != null && progress().p > ui.hudP) G.fromTo(mini, { left: ui.hudP * 100 + "%" }, { left: mini.style.left, duration: .8, ease: "power2.inOut" });
  if (mini) ui.hudP = progress().p;
}
function sheetIn() {
  if (!M()) return;
  G.from(".sheet", { opacity: 0, duration: .25 });
  G.from(".sheet .panel-s", { y: 120, opacity: 0, duration: .5, ease: "back.out(1.2)" });
  G.from(".sheet .rules li, .sheet .num", { y: 14, opacity: 0, duration: .3, stagger: .015, delay: .15 });
}

// ---------- interactions with motion ----------
function diceRoll(cb, label = "Ngocok pertanyaan…") {
  if (!M()) return cb();
  const ov = document.createElement("div");
  ov.className = "roll-ov";
  ov.innerHTML = `<div style="display:grid;justify-items:center">${diceBox(false)}<p class="hand">${label}</p></div>`;
  document.body.appendChild(ov);
  const roller = ov.querySelector(".roller");
  buzz([15, 30, 15]);
  G.timeline({ onComplete: () => { ov.remove(); cb(); } })
    .from(ov, { opacity: 0, duration: .15 })
    .from(ov.querySelector(".dice-box"), { y: -260, scale: .5, duration: .8, ease: "bounce.out" }, 0)
    .to(roller, { rotationX: 720 + rnd(4) * 90, rotationY: 540 + rnd(4) * 90, duration: 1, ease: "power3.out" }, 0)
    .from(ov.querySelector(".hand"), { y: 10, opacity: 0, duration: .3 }, .3)
    .to(ov.querySelector(".dice-box"), { scale: 1.25, duration: .12, ease: "power1.out" }, 1)
    .to(ov, { opacity: 0, duration: .2 }, 1.12);
}
function flyOut(dir, fn) {
  const card = $("#qcard");
  if (!M() || !card) return fn();
  G.to(card, { x: dir * innerWidth, rotation: dir * 24, opacity: 0, duration: .38, ease: "power2.in", onComplete: fn });
}
function bindSwipe() {
  const card = $("#qcard");
  if (!card) return;
  let x0 = null, dx = 0, id = null;
  const skipS = card.querySelector(".s-skip"), nextS = card.querySelector(".s-next");
  const setPos = () => {
    card.style.transform = `translateX(${dx}px) rotate(${dx / 16}deg)`;
    skipS.style.opacity = Math.min(1, Math.max(0, -dx / 110));
    nextS.style.opacity = Math.min(1, Math.max(0, dx / 110));
  };
  card.addEventListener("pointerdown", e => { x0 = e.clientX; dx = 0; id = e.pointerId; card.setPointerCapture(id); card.style.transition = "none"; });
  card.addEventListener("pointermove", e => { if (x0 == null) return; dx = e.clientX - x0; setPos(); });
  const up = () => {
    if (x0 == null) return;
    x0 = null;
    if (dx < -100) { card.style.transform = ""; G ? G.set(card, { x: dx, rotation: dx / 16 }) : 0; flyOut(-1, skip); }
    else if (dx > 100) { card.style.transform = ""; G ? G.set(card, { x: dx, rotation: dx / 16 }) : 0; flyOut(1, next); }
    else {
      card.style.transition = "transform .35s cubic-bezier(.3,1.6,.5,1)"; dx = 0; setPos();
      skipS.style.opacity = nextS.style.opacity = 0;
    }
  };
  card.addEventListener("pointerup", up);
  card.addEventListener("pointercancel", up);
}
function spin() {
  if (ui.spinning) return;
  const pool = eligible();
  const target = pool[rnd(pool.length)];
  if (!M() || pool.length === 1) { S.answerer = target; buzz(30); render(); burst($(`.who[data-i="${target}"]`)); return; }
  ui.spinning = true; S.answerer = null; render();
  let step = 0, delay = 55, i = rnd(pool.length);
  const total = 14 + pool.length * 2;
  const tick = () => {
    i = (i + 1) % pool.length;
    const cur = step >= total ? target : pool[i];
    $$(".who").forEach(el => el.classList.toggle("flash", +el.dataset.i === cur));
    buzz(6);
    step++;
    if (step > total) {
      ui.spinning = false; S.answerer = target; buzz([20, 40, 60]); render();

function packUrl() {
  const bytes = new TextEncoder().encode(JSON.stringify(CUSTOM));
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return location.origin + location.pathname + "#pack=" + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
// Pack links are untrusted input: only strings, trimmed, capped, de-duplicated, always rendered escaped.
function readPack() {
  const m = location.hash.match(/^#pack=([A-Za-z0-9_-]+)$/);
  if (!m) return null;
  try {
    const bin = atob(m[1].replace(/-/g, "+").replace(/_/g, "/"));
    const data = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    const qs = (Array.isArray(data) ? data : []).filter(x => typeof x === "string").map(x => x.trim().slice(0, 140)).filter(Boolean);
    return qs.length ? [...new Set(qs)].slice(0, 50) : null;
  } catch { return null; }
}

// Story-sized share image (1080x1350) drawn on canvas.
function wrapText(x, text, maxW) {
  const words = text.split(" "), lines = [];
  let line = "";
  for (const w of words) { const t = line ? line + " " + w : w; if (x.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}
function rrect(x, X, Y, W, H, R) { x.beginPath(); x.moveTo(X + R, Y); x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R); x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath(); }
